name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l ./dkls23 ./frost ./example)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -timeout 300s ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Example modules
        run: |
          cd example && go vet ./...
          cd dkls23 && go run . && cd ..
          cd frost && go run .

      - name: Fuzz smoke
        run: |
          for pkg in ./dkls23 ./frost; do
            for target in $(go test -list 'Fuzz.*' $pkg | grep '^Fuzz'); do
              go test $pkg -run '^$' -fuzz "^${target}\$" -fuzztime 5s
            done
          done

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
